<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Home{% endblock %} · AttendEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Top bar: only visible on phones/tablets -->
<nav class="navbar bg-dark d-lg-none">
    <div class="container-fluid">
        <span class="navbar-brand text-white mb-0"><i class="bi bi-calendar-check me-2"></i>AttendEase</span>
        <button class="btn btn-outline-light" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu">
            <i class="bi bi-list"></i>
        </button>
    </div>
</nav>

<div class="app-layout">

    <!-- Sidebar: fixed on large screens, slide-in menu on small screens -->
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar">
        <div class="offcanvas-header">
            <button type="button" class="btn-close btn-close-white ms-auto"
                    data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="w-100">
                <div class="sidebar-brand mb-4">
                    <i class="bi bi-calendar-check me-2"></i>AttendEase
                </div>
                <nav class="nav flex-column gap-1">
                    <a class="nav-link {% if request.blueprint == 'dashboard' %}active{% endif %}"
                       href="{{ url_for('dashboard.index') }}">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                    <a class="nav-link {% if request.blueprint == 'students' %}active{% endif %}"
                       href="{{ url_for('students.list_students') }}">
                        <i class="bi bi-people me-2"></i>Students
                    </a>
                    <a class="nav-link {% if request.endpoint == 'attendance.mark' %}active{% endif %}"
                       href="{{ url_for('attendance.mark') }}">
                        <i class="bi bi-check2-square me-2"></i>Mark Attendance
                    </a>
                    <a class="nav-link {% if request.endpoint == 'attendance.history' %}active{% endif %}"
                       href="{{ url_for('attendance.history') }}">
                        <i class="bi bi-clock-history me-2"></i>History
                    </a>
                </nav>
            </div>
        </div>
    </aside>

    <main class="main-content p-3 p-lg-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
