{% extends "base.html" %}
{% block title %}{{ 'Add Student' if mode == 'add' else 'Edit Student' }}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{{ 'Add Student' if mode == 'add' else 'Edit Student' }}</h1>

{% if errors %}
    <div class="alert alert-danger">
        <ul class="mb-0">
            {% for e in errors %}<li>{{ e }}</li>{% endfor %}
        </ul>
    </div>
{% endif %}

<div class="card shadow-sm" style="max-width: 640px;">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label for="roll_number" class="form-label">Roll number</label>
                <input type="text" class="form-control" id="roll_number" name="roll_number"
                       maxlength="20" required value="{{ form.roll_number or '' }}">
            </div>
            <div class="mb-3">
                <label for="full_name" class="form-label">Full name</label>
                <input type="text" class="form-control" id="full_name" name="full_name"
                       maxlength="100" required value="{{ form.full_name or '' }}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       maxlength="100" required value="{{ form.email or '' }}">
            </div>
            <div class="mb-4">
                <label for="class_name" class="form-label">Class</label>
                <input type="text" class="form-control" id="class_name" name="class_name"
                       maxlength="50" required placeholder="e.g. BCA-1" value="{{ form.class_name or '' }}">
            </div>
            <button type="submit" class="btn btn-primary">
                {{ 'Add Student' if mode == 'add' else 'Save Changes' }}
            </button>
            <a href="{{ url_for('students.list_students') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
